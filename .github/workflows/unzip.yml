name: Unzip and Split Sprites

on: [push]

permissions:
  contents: write

jobs:
  unzip-and-split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Unzip and Split
        run: |
          # 1. Create a temporary folder to unzip everything into
          mkdir -p temp_all_sprites
          
          # 2. Unzip every .zip file in the root directory into the temp folder
          for file in *.zip; do
            if [ -f "$file" ]; then
              echo "Unzipping $file..."
              unzip -o -q "$file" -d temp_all_sprites/
            fi
          done

          # 3. Split the files into batches of 500
          mkdir -p split_sprites
          
          # Find ALL files (even inside subfolders), sort them, and split into text lists of 500 paths each
          find temp_all_sprites -type f | sort | split -l 500 - batch_
          
          # 4. Move each batch into its own numbered folder
          i=1
          for batch in batch_*; do
            FOLDER_NAME="split_sprites/sprites_batch_$i"
            mkdir -p "$FOLDER_NAME"
            
            # Read the file paths from the batch list
            while IFS= read -r filepath; do
              # Move the file directly into the batch folder (flattening the structure)
              # This prevents GitHub folder limit errors
              mv "$filepath" "$FOLDER_NAME/"
            done < "$batch"
            
            # Clean up the text file
            rm "$batch"
            i=$((i+1))
          done
          
          # Clean up the empty temp folder
          rm -rf temp_all_sprites

      - name: Commit and Push the split files
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add split_sprites/
          
          # The || echo prevents the action from failing if there were no changes
          git commit -m "Automated unzip and split into batches of 500" || echo "No changes to commit"
          git push
