name: Unzip Sprites

on: [push]

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Unzip the sprites
        run: |
          sudo apt-get install unzip
          unzip sprites.zip -d sprites/
          
      - name: Commit and Push the unzipped files
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add sprites/
          git commit -m "Automated unzip of sprite files"
          git push
